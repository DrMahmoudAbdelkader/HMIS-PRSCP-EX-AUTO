name: Daily DMS extraction (20:00 Cairo)

on:
  schedule:
    # Cairo now observes DST (EEST, UTC+3) roughly late-Apr -> late-Oct,
    # and EET (UTC+2) the rest of the year. GitHub Actions cron is UTC-only
    # and does NOT auto-adjust for DST, so we schedule BOTH possible UTC
    # times and let the "Check it's actually 20:00 in Cairo" step below skip
    # the wrong one. You don't need to touch this twice a year.
    #
    # Target: 20:00 Cairo
    #   EEST (UTC+3, summer): 20:00 - 3h = 17:00 UTC
    #   EET  (UTC+2, winter): 20:00 - 2h = 18:00 UTC
    - cron: "0 17 * * *"   # 20:00 Cairo when Cairo is UTC+3 (EEST, summer)
    - cron: "0 18 * * *"   # 20:00 Cairo when Cairo is UTC+2 (EET, winter)
  workflow_dispatch: {}    # lets you also trigger it manually from the Actions tab

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # was 60 — the per-patient scraping loop needs ~65-70 min for a full run, this gives headroom for slower nights
    steps:
      - name: Check it's actually ~20:00 in Cairo right now
        id: gate
        run: |
          # GitHub's scheduled triggers are best-effort and can be delayed
          # by anywhere from a few minutes to over an hour at busy times,
          # so instead of requiring an exact HH:MM match we check that
          # we're within a window after the 20:00 target. This also means
          # only ONE of the two cron slots (summer/winter) will ever be
          # "in window" on a given day, so there's no risk of it running twice.
          now_minutes=$(TZ=Africa/Cairo date +%H:%M | awk -F: '{print $1*60+$2}')
          target_minutes=$((20*60+0))     # 20:00
          window_minutes=90               # accept up to 90 min of delay

          echo "Current Cairo time: $(TZ=Africa/Cairo date +%H:%M)"

          diff=$(( (now_minutes - target_minutes + 1440) % 1440 ))

          if [ "$diff" -gt "$window_minutes" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not within the 20:00 Cairo window (DST offset didn't match this cron slot, or GitHub delayed the trigger too much) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run the coupled extraction pipeline
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HMIS_USERNAME: ${{ secrets.HMIS_USERNAME }}
          HMIS_PASSWORD: ${{ secrets.HMIS_PASSWORD }}
          QUEUE_OUTPUT_DIR: ${{ github.workspace }}/run-output
          MASTER_OUTPUT_PATH: ${{ github.workspace }}/run-output/Cumulative_Patient_Clinical_Data.xlsx
        run: |
          mkdir -p "$QUEUE_OUTPUT_DIR"
          python Extract_DMS_Patients_Prescriptioned_Services_Data_modified.py

      - name: Upload run output as a workflow artifact (audit trail)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dms-run-output-${{ github.run_id }}
          path: run-output/
          retention-days: 30
