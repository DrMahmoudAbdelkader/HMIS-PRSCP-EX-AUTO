name: Daily DMS extraction (7pm Cairo)

on:
  schedule:
    # Cairo now observes DST (EEST, UTC+3) roughly late-Apr -> late-Oct,
    # and EET (UTC+2) the rest of the year. GitHub Actions cron is UTC-only
    # and does NOT auto-adjust for DST, so we schedule BOTH possible UTC
    # times and let the "Check it's actually 7pm in Cairo" step below skip
    # the wrong one. You don't need to touch this twice a year.
    - cron: "0 16 * * *"   # 19:00 Cairo when Cairo is UTC+3 (EEST, summer)
    - cron: "0 17 * * *"   # 19:00 Cairo when Cairo is UTC+2 (EET, winter)
  workflow_dispatch: {}    # lets you also trigger it manually from the Actions tab

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check it's actually 7pm in Cairo right now
        id: gate
        run: |
          hour=$(TZ=Africa/Cairo date +%H)
          echo "Current Cairo hour: $hour"
          if [ "$hour" != "19" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not 19:00 in Cairo (DST offset didn't match this cron slot) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run the coupled extraction pipeline
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HMIS_USERNAME: ${{ secrets.HMIS_USERNAME }}
          HMIS_PASSWORD: ${{ secrets.HMIS_PASSWORD }}
          QUEUE_OUTPUT_DIR: ${{ github.workspace }}/run-output
          MASTER_OUTPUT_PATH: ${{ github.workspace }}/run-output/Cumulative_Patient_Clinical_Data.xlsx
        run: |
          mkdir -p "$QUEUE_OUTPUT_DIR"
          python Extract_DMS_Patients_Prescriptioned_Services_Data_modified.py

      - name: Upload run output as a workflow artifact (audit trail)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dms-run-output-${{ github.run_id }}
          path: run-output/
          retention-days: 30
